// ─── DrumPicker (iOS-Stil) ────────────────────────────────────────────────────
function DrumPicker({ value, onChange, items, width = 80 }) {
  const ITEM_H  = 44;
  const VISIBLE = 5;          // odd number → clear centre
  const PAD     = Math.floor(VISIBLE / 2);   // = 2

  // Find initial index; fallback to 0 so minutes like "30" are found correctly
  const findIdx = (v) => {
    const i = items.findIndex(x => x === v);
    return i >= 0 ? i : 0;
  };

  const [idx, setIdx]       = useState(() => findIdx(value));
  const [drag, setDrag]     = useState(null);  // { startY, startIdx } while dragging
  const [offset, setOffset] = useState(0);     // fractional px offset during drag

  // Sync if parent resets value (e.g. opening a different entry)
  const prevValue = useRef(value);
  useEffect(() => {
    if (prevValue.current !== value && drag === null) {
      const ni = findIdx(value);
      setIdx(ni);
      setOffset(0);
    }
    prevValue.current = value;
  }, [value, drag]);

  const clamp = (i) => Math.max(0, Math.min(items.length - 1, i));

  /* ── Drag helpers ── */
  const startDrag = (clientY) =>
    setDrag({ startY: clientY, startIdx: idx });

  const moveDrag = (clientY) => {
    if (!drag) return;
    const delta = drag.startY - clientY;          // positive = scroll up = higher index
    const moved = Math.round(delta / ITEM_H);
    const ni    = clamp(drag.startIdx + moved);
    const rem   = delta - moved * ITEM_H;         // sub-item fractional offset
    setIdx(ni);
    setOffset(rem);                               // smooth visual drag
  };

  const endDrag = () => {
    if (!drag) return;
    setDrag(null);
    setOffset(0);
    onChange(items[idx]);                         // commit only on release
  };

  /* ── Pointer (mouse / stylus) ── */
  const onPD = (e) => { e.currentTarget.setPointerCapture(e.pointerId); startDrag(e.clientY); };
  const onPM = (e) => moveDrag(e.clientY);
  const onPU = ()  => endDrag();

  /* ── Touch ── */
  const onTS = (e) => startDrag(e.touches[0].clientY);
  const onTM = (e) => { e.preventDefault(); moveDrag(e.touches[0].clientY); };
  const onTE = ()  => endDrag();

  /* ── Tap on any row ── */
  const onTap = (e, realIdx) => {
    e.stopPropagation();
    if (realIdx < 0 || realIdx >= items.length) return;
    setIdx(realIdx);
    setOffset(0);
    onChange(items[realIdx]);
  };

  // translateY: item at idx lands exactly on the centre stripe
  const translateY = (PAD - idx) * ITEM_H - offset;
  const padded = [
    ...Array(PAD).fill(null),
    ...items,
    ...Array(PAD).fill(null),
  ];

  return (
    <div
      style={{ width: width, height: ITEM_H * VISIBLE, overflow:"hidden", position:"relative",
               touchAction:"none", userSelect:"none", cursor:"ns-resize" }}
      onPointerDown={onPD} onPointerMove={onPM} onPointerUp={onPU}
      onTouchStart={onTS}  onTouchMove={onTM}   onTouchEnd={onTE}
    >
      {/* Top fade */}
      <div style={{ position:"absolute", top:0, left:0, right:0, height: ITEM_H * PAD,
        background:"linear-gradient(to bottom,rgba(242,242,247,.97),rgba(242,242,247,0))",
        zIndex:3, pointerEvents:"none" }}/>
      {/* Bottom fade */}
      <div style={{ position:"absolute", bottom:0, left:0, right:0, height: ITEM_H * PAD,
        background:"linear-gradient(to top,rgba(242,242,247,.97),rgba(242,242,247,0))",
        zIndex:3, pointerEvents:"none" }}/>
      {/* Centre selection stripe – FIXED, never moves */}
      <div style={{ position:"absolute", top: ITEM_H * PAD, left:6, right:6, height: ITEM_H,
        borderTop:"0.5px solid rgba(0,0,0,0.14)", borderBottom:"0.5px solid rgba(0,0,0,0.14)",
        borderRadius:10, background:"rgba(0,0,0,0.045)", zIndex:2, pointerEvents:"none" }}/>
      {/* Scrolling list */}
      <div style={{ display:"flex", flexDirection:"column",
                    transform:`translateY(${translateY}px)`,
                    willChange:"transform" }}>
        {padded.map((v, i) => {
          const realIdx  = i - PAD;          // index in items[]
          const isCentre = realIdx === idx;
          return (
            <div key={i}
              style={{ height: ITEM_H, display:"flex", alignItems:"center",
                       justifyContent:"center", letterSpacing:-0.5,
                       fontFamily:"-apple-system, Helvetica, sans-serif",
                       fontSize:   isCentre ? 24 : 19,
                       fontWeight: isCentre ? 600  : 400,
                       color:      isCentre ? "#000" : "rgba(0,0,0,0.28)",
                       pointerEvents: v !== null ? "auto" : "none",
                       cursor: v !== null ? "pointer" : "default" }}
              onClick={(e) => v !== null && onTap(e, realIdx)}
            >
              {v !== null ? fmt2(v) : ""}
            </div>
          );
        })}
      </div>
    </div>
  );
}

    setEditField("start"); setEditError("");

    const dur = (ne-ns)*60;

                <span style={{fontFamily:"monospace",fontSize:16,fontWeight:800,
                  color:TYPE_COLORS[editEntry.type]}}>{TYPE_ICONS[editEntry.type]}</span>
                <span style={{fontSize:14,color:IOS.label2}}>{editEntry.type}</span>
                {editEntry.note!=="–" && <span style={{fontSize:14,color:IOS.label3}}>· {editEntry.note}</span>}
              </div>
              <div style={{display:"flex",gap:12,padding:"16px 20px 8px"}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:11,color:IOS.label3,textTransform:"uppercase",letterSpacing:0.5,marginBottom:6}}>Startzeit</div>
                  <label style={{display:"block",background:"#E9E9EF",borderRadius:12,padding:"14px 16px",position:"relative"}}>
                    <div style={{fontFamily:IOS.mono,fontSize:28,fontWeight:300,color:IOS.label,letterSpacing:-1,lineHeight:1}}>
                      {fmtHHMM(editSH,editSM)}
                    </div>
                    <input type="time" value={fmtHHMM(editSH,editSM)}
                      onChange={(e)=>{ const [h,m]=e.target.value.split(":").map(Number); setEditSH(h); setEditSM(m); setEditError(""); }}
                      style={{position:"absolute",inset:0,opacity:0,width:"100%",height:"100%",cursor:"pointer"}}/>
                  </label>
                  <div style={{fontSize:11,color:IOS.label3,textAlign:"center",marginTop:4}}>Tippen zum Ändern</div>
                </div>
                <div style={{display:"flex",alignItems:"center",paddingTop:8}}>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,0.25)" strokeWidth="2" strokeLinecap="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                  </svg>
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:11,color:IOS.label3,textTransform:"uppercase",letterSpacing:0.5,marginBottom:6}}>Endzeit</div>
                  <label style={{display:"block",background:"#E9E9EF",borderRadius:12,padding:"14px 16px",position:"relative"}}>
                    <div style={{fontFamily:IOS.mono,fontSize:28,fontWeight:300,color:IOS.label,letterSpacing:-1,lineHeight:1}}>
                      {fmtHHMM(editEH,editEM)}
                    </div>
                    <input type="time" value={fmtHHMM(editEH,editEM)}
                      onChange={(e)=>{ const [h,m]=e.target.value.split(":").map(Number); setEditEH(h); setEditEM(m); setEditError(""); }}
                      style={{position:"absolute",inset:0,opacity:0,width:"100%",height:"100%",cursor:"pointer"}}/>
                  </label>
                  <div style={{fontSize:11,color:IOS.label3,textAlign:"center",marginTop:4}}>Tippen zum Ändern</div>
                </div>
              </div>
              <div style={{margin:"4px 20px 0",padding:"12px 16px",background:"rgba(189,189,0,0.08)",borderRadius:12,
                display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontSize:13,color:IOS.label2}}>Dauer</span>
                <span style={{fontFamily:IOS.mono,fontSize:17,fontWeight:600,
                  color:(editEH*60+editEM)>(editSH*60+editSM)?CD:IOS.red}}>
                  {(editEH*60+editEM)>(editSH*60+editSM)
                    ? fmtHM((editEH*60+editEM-(editSH*60+editSM))*60)
                    : "⚠ Ungültig"}
                </span>
              </div>
              {editError && <div className="edit-error-box">⚠ {editError}</div>}
              <div style={{height:16}}/>
            </div>
          </div>
        )}

        {/* Tab Bar */}
        <div className="ios-tabbar">
          {[
            {key:"home",      label:"Home",      svg:(active)=>(
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active?CD:"rgba(0,0,0,0.3)"} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
                <path d="M9 21V12h6v9"/>
              </svg>
            )},
            {key:"auftraege", label:"Aufträge",  svg:(active)=>(
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active?CD:"rgba(0,0,0,0.3)"} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <path d="M16 2v4M8 2v4M3 10h18"/>
                <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
              </svg>
            )},
            {key:"timer",     label:"Timer",     svg:(active)=>(
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active?CD:"rgba(0,0,0,0.3)"} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="13" r="8"/>
                <path d="M12 9v4l3 3"/>
                <path d="M9.5 2.5h5M12 2.5V5"/>
              </svg>
            )},
            {key:"log",       label:"Zeiten",  svg:(active)=>(
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active?CD:"rgba(0,0,0,0.3)"} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                <rect x="9" y="3" width="6" height="4" rx="1"/>
                <path d="M9 12h6M9 16h4"/>
              </svg>
            )},
            {key:"stats",     label:"Auswertung",svg:(active)=>(
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke={active?CD:"rgba(0,0,0,0.3)"} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 20V10M12 20V4M6 20v-6"/>
              </svg>
            )},
          ].map(({key,label,svg})=>(
            <button key={key} className="ios-tab" onClick={()=>{setTab(key);if(key!=="auftraege"){setSelectedAuftrag(null);setSubPage(null);setShowMaterialSheet(false);}}}>
              <span className="ios-tab-icon" style={{lineHeight:1,display:"flex",alignItems:"center",justifyContent:"center"}}>
                {svg(tab===key)}
              </span>
              <span className="ios-tab-label" style={{
                color: tab===key ? CD : "rgba(0,0,0,0.35)",
              }}>{label}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ZeiterfassungApp />);
  </script>
</body>
</html>
